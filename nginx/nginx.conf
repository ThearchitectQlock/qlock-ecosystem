# ═══════════════════════════════════════════════════════════════════════
# Q-Lock edge — TLS termination, rate limiting, routing
#
# One domain: q-lock-ecosystem.com. The console is at /, the NEV369
# explorer at /explorer/, the node's read API at /node/, the escrow API
# at /api/ and its named paths. www redirects to the bare domain so the
# browser origin — and therefore CORS — is always the same one.
#
# /metrics IS DELIBERATELY NOT ROUTED HERE. Both backends expose it on
# the internal network for Prometheus. There is no location block for it
# in either server, on purpose: the escrow metrics leak business volume
# (escrows created, sends, Xaman connects) and anything scrapeable from
# the internet is scrapeable by a competitor. If you add one, you have
# made a business decision, not a configuration change.
# ═══════════════════════════════════════════════════════════════════════

user  nginx;
worker_processes auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time ut=$upstream_response_time';
    access_log /var/log/nginx/access.log main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    server_tokens   off;

    client_max_body_size 1m;
    # NEV369 addresses are 5,184 hex characters and appear in URL paths
    # (/node/balance/…, /node/address/…/transactions). The default 8k
    # header buffers fit one; 16k leaves room for the rest of the request.
    large_client_header_buffers 4 16k;
    client_body_timeout  10s;
    client_header_timeout 10s;

    gzip on;
    gzip_types application/json text/plain text/css application/javascript;
    gzip_min_length 1024;

    # ── Rate limit zones ───────────────────────────────────────────────
    #
    # Separate zones per surface. One shared zone would let node traffic
    # exhaust the escrow budget and vice versa.
    #
    # auth is tightest: /auth/login is the credential-stuffing target and
    # every request there costs an Argon2 verification, so a flood is
    # also a CPU exhaustion vector.

    limit_req_zone $binary_remote_addr zone=escrow_api:10m  rate=120r/m;
    limit_req_zone $binary_remote_addr zone=escrow_auth:10m rate=10r/m;
    # Writes only: the Xaman flows poll GET status URLs under the same
    # paths every few seconds, and those must not eat the write budget.
    # An empty key is not limited, so GETs fall through to escrow_api.
    map $request_method $escrow_write_key {
        default "";
        POST    $binary_remote_addr;
        PUT     $binary_remote_addr;
        PATCH   $binary_remote_addr;
        DELETE  $binary_remote_addr;
    }
    limit_req_zone $escrow_write_key zone=escrow_write:10m rate=20r/m;
    limit_req_zone $binary_remote_addr zone=nev369_api:10m  rate=60r/m;
    # GodShield API: scans are CPU work, so a bucket of their own.
    limit_req_zone $binary_remote_addr zone=godshield_api:10m rate=60r/m;
    limit_req_status 429;
    limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;

    # ── Upstreams ──────────────────────────────────────────────────────

    upstream escrow_backend {
        server escrow:8080 max_fails=3 fail_timeout=15s;
        keepalive 32;
    }

    upstream nev369_backend {
        server nev369-node-1:8080 max_fails=3 fail_timeout=15s;
        keepalive 16;
    }

    # ── Shared proxy headers ───────────────────────────────────────────

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ── Default server: reject unknown Host ────────────────────────────
    # Without this, any hostname pointed at this IP gets served by
    # whichever server block happens to be first.

    server {
        listen 80 default_server;
        listen 443 ssl default_server;
        http2 on;
        server_name _;
        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        return 444;
    }

    # ── HTTP → HTTPS (and the certificate challenge) ───────────────────

    server {
        listen 80;
        server_name q-lock-ecosystem.com www.q-lock-ecosystem.com;

        # Let's Encrypt renewals: certbot writes the challenge file here.
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://q-lock-ecosystem.com$request_uri;
        }
    }

    # ── www → bare domain ──────────────────────────────────────────────

    server {
        listen 443 ssl;
        http2 on;
        server_name www.q-lock-ecosystem.com;
        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        return 301 https://q-lock-ecosystem.com$request_uri;
    }

    # ── q-lock-ecosystem.com — console, explorer, escrow, node ─────────

    server {
        listen 443 ssl;
        http2 on;
        server_name q-lock-ecosystem.com;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;
        # No OCSP stapling: Let's Encrypt retired its OCSP service in 2025,
        # so there is nothing to staple and nginx would only log warnings.

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        limit_conn conn_per_ip 20;

        # Stripe webhook. Rate limited loosely and NOT auth-gated —
        # Stripe authenticates by HMAC signature, verified in
        # billing.rs, which fails closed. Do not put an auth layer in
        # front of this or legitimate webhooks get 401'd and Stripe
        # eventually stops retrying.
        #
        # proxy_request_buffering must stay on: signature verification
        # needs the exact raw body.
        location = /billing/webhook {
            limit_req zone=escrow_api burst=20 nodelay;
            proxy_pass http://escrow_backend/billing/webhook;
            include /etc/nginx/proxy_params_qlock;
            # Signature verification needs the exact raw body.
            proxy_request_buffering on;
        }

        # Credential endpoints — tightest bucket.
        location ~ ^/auth/(login|register)$ {
            limit_req zone=escrow_auth burst=5 nodelay;
            proxy_pass http://escrow_backend;
            include /etc/nginx/proxy_params_qlock;
        }

        # State-changing escrow and send paths. Each of these either
        # builds an XRPL transaction or writes a settlement record.
        location ~ ^/(send|escrow|wallet/xumm) {
            limit_req zone=escrow_write burst=10 nodelay;
            limit_req zone=escrow_api burst=30 nodelay;
            proxy_pass http://escrow_backend;
            include /etc/nginx/proxy_params_qlock;
        }

        # The unified console. Served as static files; the API lives
        # under the paths above, so this is a plain root handler.
        location / {
            root /usr/share/nginx/html;   # apps/qlock-web
            try_files $uri $uri/ /index.html;
        }

        # The metering check is for nginx's own subrequests only.
        location ^~ /api/internal/ { return 404; }

        location /api/ {
            limit_req zone=escrow_api burst=30 nodelay;
            proxy_pass http://escrow_backend/;
            include /etc/nginx/proxy_params_qlock;
        }

        # The console reaches the escrow through /api/. Its credential and
        # state-changing paths keep the same tight buckets as the bare
        # paths above — otherwise /api/auth/login would be a way around
        # the login rate limit. (Regex locations win over the /api/ prefix.)
        location ~ ^/api/auth/(login|register)$ {
            limit_req zone=escrow_auth burst=5 nodelay;
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://escrow_backend;
            include /etc/nginx/proxy_params_qlock;
        }
        location ~ ^/api/(send|escrow|wallet/xumm) {
            limit_req zone=escrow_write burst=10 nodelay;
            limit_req zone=escrow_api burst=30 nodelay;
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://escrow_backend;
            include /etc/nginx/proxy_params_qlock;
        }

        # Public downloads: the NEV369 node + wallet package and its
        # installer (built on the server by scripts/build-downloads.sh).
        location /downloads/ {
            alias /usr/share/nginx/downloads/;
            autoindex off;
            types {
                text/plain       sh txt;
                application/gzip gz;
            }
            default_type text/plain;
            expires -1;
        }

        # NEV369 Explorer, served beside the console.
        location = /explorer { return 301 /explorer/; }
        location /explorer/ {
            alias /usr/share/nginx/explorer/;
            try_files $uri $uri/ /explorer/index.html;
        }

        # Read access to the node for the explorer and console. Writes go
        # through the node's own rate limits; production disables /mine
        # and /wallet/new in the node itself.
        location /node/ {
            limit_req zone=nev369_api burst=15 nodelay;
            proxy_pass http://nev369_backend/;
            include /etc/nginx/proxy_params_qlock;
        }

        location = /health {
            access_log off;
            proxy_pass http://nev369_backend/health;
        }

        # GodShield API — scanner, signature verification, PQ gateway.
        # Resolved per request (like the bridge below) so nginx still starts
        # if the godshield profile is not running. The gateway's admin
        # routes (register, rotate, sign) check a bearer token in the service.
        # Metered calls: nginx asks the escrow service (which owns accounts
        # and Stripe plans) before each one — see godshield_billing.rs.
        # 401 = unknown API key; 403 from the check becomes 402 with the
        # reason (quota reached) in the body.
        location ~ ^/godshield/api/v1/(scan|verify|address/encode|transaction/build|gateway/verify|gateway/policy/check)$ {
            limit_req zone=godshield_api burst=20 nodelay;
            auth_request /_gs_authorize;
            auth_request_set $gs_reason $upstream_http_x_godshield_reason;
            error_page 401 = @gs_unauthorized;
            error_page 403 = @gs_quota;
            resolver 127.0.0.11 valid=30s ipv6=off;
            set $godshield godshield-api:8090;
            rewrite ^/godshield/(.*)$ /$1 break;
            proxy_pass http://$godshield;
            include /etc/nginx/proxy_params_qlock;
        }
        location = /_gs_authorize {
            internal;
            proxy_pass http://escrow_backend/internal/godshield/authorize;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-GS-Client-IP  $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-API-Key       $http_x_api_key;
            proxy_set_header Authorization   $http_authorization;
        }
        location @gs_unauthorized {
            default_type application/json;
            return 401 '{"error":"$gs_reason"}';
        }
        location @gs_quota {
            default_type application/json;
            return 402 '{"error":"$gs_reason"}';
        }

        location = /godshield { return 301 /godshield/; }
        location /godshield/ {
            limit_req zone=godshield_api burst=20 nodelay;
            resolver 127.0.0.11 valid=30s ipv6=off;
            set $godshield godshield-api:8090;
            rewrite ^/godshield/(.*)$ /$1 break;
            proxy_pass http://$godshield;
            include /etc/nginx/proxy_params_qlock;
        }

        # Status reads for the console's network panel, nothing more:
        # node-2's height and the bridge coordinator's circuit state.
        # Resolved per request through Docker's DNS, so nginx starts even
        # when the bridge profile is not running (the panel shows offline).
        location = /node2/info {
            limit_req zone=nev369_api burst=15 nodelay;
            resolver 127.0.0.11 valid=30s ipv6=off;
            set $node2 nev369-node-2:8080;
            proxy_pass http://$node2/info;
            include /etc/nginx/proxy_params_qlock;
        }
        location = /bridge/health {
            limit_req zone=nev369_api burst=15 nodelay;
            resolver 127.0.0.11 valid=30s ipv6=off;
            set $bridge bridge-coordinator:9370;
            proxy_pass http://$bridge/health;
            include /etc/nginx/proxy_params_qlock;
        }

        # The libp2p swarm on :4001 is NOT proxied. Peer transport is
        # noise-encrypted and multiplexed; it does not belong behind an
        # HTTP reverse proxy. The port is published directly.

        # No /metrics location. See the header comment. The /api/ and
        # /node/ prefixes would otherwise pass it straight through.
        location = /api/metrics  { return 404; }
        location = /node/metrics { return 404; }
    }
}

[package]
name = "godshield-wasm"
description = "Browser-side Dilithium5 signing via WebAssembly."
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
godshield-core = { workspace = true }
wasm-bindgen = "0.2"
serde-wasm-bindgen = "0.6"
console_error_panic_hook = "0.1"
serde = { workspace = true }
serde_json = { workspace = true }
hex = { workspace = true }

# NOTE: this crate targets wasm32-unknown-unknown. It compiles on the
# host for `cargo check --workspace`, but the browser build is
#   wasm-pack build crates/godshield-wasm --target web
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
